name: Lichii 简体中文 Windows 构建

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: lichii-zh-cn
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      title: ${{ steps.release.outputs.title }}
    steps:
      - name: 检查最新上游 Release
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const upstream = { owner: 'zortos293', repo: 'Lichii' };
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...upstream, per_page: 100
            });
            const latest = releases.filter(r => !r.draft && /^build-\d+$/.test(r.tag_name))
              .sort((a, b) => Date.parse(b.published_at) - Date.parse(a.published_at))[0];
            core.setOutput('needed', 'false');
            if (!latest) return;
            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: latest.tag_name
              });
              if (!existing.draft && existing.assets.some(a =>
                a.name === 'lichii-windows-x86_64.zip' && a.state === 'uploaded')) {
                core.info(latest.tag_name + ' 已发布中文版，跳过。');
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: commit } = await github.rest.repos.getCommit({
              ...upstream, ref: latest.tag_name
            });
            core.setOutput('tag', latest.tag_name);
            core.setOutput('sha', commit.sha);
            core.setOutput('title', (latest.name || latest.tag_name) + ' Win[ZH]');
            core.setOutput('needed', 'true');

  windows:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.check.outputs.tag }}
      RELEASE_TITLE: ${{ needs.check.outputs.title }}
      UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      FORK_REPO: ${{ github.repository }}
    steps:
      - name: 获取上游 Release 源码
        uses: actions/checkout@v5
        with:
          repository: zortos293/Lichii
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - name: 获取构建下载适配器
        uses: actions/checkout@v5
        with:
          path: build-ci
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: 通过官方资产 API 下载构建依赖
        shell: pwsh
        run: python build-ci/.github/scripts/dependency_api.py . "$env:RUNNER_TEMP/lichii-dependency-api"

      - name: 设置 MSVC SDK
        uses: ilammy/msvc-dev-cmd@v1

      - name: 使用云构建机自带的 LLVM
        shell: pwsh
        run: |
          $llvm = 'C:/Program Files/LLVM'
          & "$llvm/bin/clang-cl.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'clang-cl is unavailable' }
          "LLVM_ROOT=$llvm" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: 安装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: 安装 Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: 添加中文并修改更新仓库地址
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          
          supplements = {
              "MainWindow": {
                  "Open &Lichii Folders": "打开 Lichii 文件夹(&L)",
                  "&About Lichii": "关于 Lichii(&A)",
                  "&Lichii Dependencies": "Lichii 依赖项(&L)",
                  "Conversion in Progress": "正在转换",
                  "This game cannot be started while its dump is being converted.": "游戏文件正在转换，暂时无法启动。",
                  "Recommended Mario Kart World settings": "《马力欧卡丁车 世界》推荐设置",
                  "Preparing game files...": "正在准备游戏文件…",
                  "Unable to prepare game files": "无法准备游戏文件",
                  "Game preparation failed. See the log for details.": "游戏文件准备失败，详情请查看日志。",
                  "Hardware requirements not met": "未满足硬件要求",
                  "Convert to NUP": "转换为 NUP",
                  "The target archive already exists:\n%1": "目标归档已存在：\n%1",
                  "Resume Conversion": "继续转换",
                  "Resume the interrupted conversion?": "是否继续上次中断的转换？",
                  "Converting to NUP": "正在转换为 NUP",
                  "Conversion Complete": "转换完成",
                  "The NUP was created and the loose folder was removed.": "已创建 NUP 并移除原文件夹。",
                  "The NUP was created. You can delete the loose folder if you no longer need it.": "已创建 NUP。如不再需要原文件夹，可以删除它。",
                  "Conversion Cancelled": "转换已取消",
                  "The conversion can be resumed by choosing Convert to NUP again.": "再次选择“转换为 NUP”可继续转换。",
                  "Conversion Failed": "转换失败",
                  "Extract NUP": "解包 NUP",
                  "The target directory already exists:\n%1": "目标目录已存在：\n%1",
                  "Extracting NUP": "正在解包 NUP",
                  "Extraction Complete": "解包完成",
                  "The NUP was extracted. You can delete the NUP file if you no longer need it.": "NUP 已解包。如不再需要原 NUP 文件，可以删除它。",
                  "Extraction Failed": "解包失败",
                  "Editing NUP Metadata": "正在编辑 NUP 元数据",
                  "Edit Complete": "编辑完成",
                  "The NUP metadata was updated.": "NUP 元数据已更新。",
                  "Edit Failed": "编辑失败",
                  "Restart Lichii to apply the X11 backend.": "重启 Lichii 以启用 X11 后端。",
                  "Are you sure you want to close Lichii?": "确定要关闭 Lichii 吗？",
                  "The currently running application has requested Lichii to not exit.\n\nWould you like to bypass this and exit anyway?": "当前运行的应用请求 Lichii 保持运行。\n\n是否忽略该请求并退出？",
              },
              "ConfigureDialog": {"Lichii Configuration": "Lichii 设置"},
              "ConfigureDebug": {
                  "**This will be reset automatically when Lichii closes.": "**关闭 Lichii 时，此项将自动重置。",
              },
              "ConfigureInputAdvanced": {"Requires restarting Lichii": "需要重启 Lichii"},
              "ConfigureWeb": {"Lichii Web Service": "Lichii 网络服务"},
              "AboutDialog": {"About Lichii": "关于 Lichii"},
              "ConfigurePerGame": {
                  "Preview a local icon next to the archive. Online lookup is optional. Apply or OK saves changes.": "预览归档文件旁的本地图标，可选用在线查找。点击“应用”或“确定”保存更改。",
                  "Detect Icon": "查找图标",
                  "Preview a local image as the game icon. Apply or OK saves changes.": "预览本地图片作为游戏图标。点击“应用”或“确定”保存更改。",
                  "Upload Icon...": "选择图标…",
                  "Allow online lookup": "允许在线查找",
                  "If no local icon is found, send the game name to GitHub, Wikipedia and Bing to look for an icon. Disabled by default.": "如果找不到本地图标，将游戏名称发送到 GitHub、维基百科和必应以查找图标。此选项默认关闭。",
                  "Enter game name...": "输入游戏名称…",
                  "Edit the game name stored in the NUP metadata": "编辑 NUP 元数据中保存的游戏名称",
                  "Select Game Icon": "选择游戏图标",
                  "Images (*.png *.jpg *.jpeg *.bmp *.webp);;All Files (*)": "图片 (*.png *.jpg *.jpeg *.bmp *.webp);;所有文件 (*)",
                  "Invalid Image": "无效图片",
                  "Select a PNG, JPEG, BMP or WebP image up to 8 MiB, 8192 pixels per side and 16 megapixels.": "请选择 PNG、JPEG、BMP 或 WebP 图片，大小不超过 8 MiB，单边不超过 8192 像素，总像素不超过 1600 万。",
                  "Please enter a game name first so the icon can be detected.": "请输入游戏名称，以便查找图标。",
                  "The game name is too long to search.": "游戏名称太长，无法搜索。",
                  "Detecting...": "正在查找…",
                  "Update NUP Metadata": "更新 NUP 元数据",
                  "Stop emulation before changing NUP metadata.": "请先停止模拟，再修改 NUP 元数据。",
                  "Failed to update NUP metadata:\n%1": "无法更新 NUP 元数据：\n%1",
              },
          }
          
          path = Path("dist/languages/zh_CN.ts")
          tree = ET.parse(path)
          root = tree.getroot()
          contexts = {context.findtext("name"): context for context in root.findall("context")}
          for name, entries in supplements.items():
              context = contexts.get(name)
              if context is None:
                  context = ET.SubElement(root, "context")
                  ET.SubElement(context, "name").text = name
          
              messages = {
                  message.findtext("source"): message
                  for message in context.findall("message")
                  if not message.findtext("comment") and message.get("numerus") != "yes"
              }
              for source, text in entries.items():
                  message = messages.get(source)
                  if message is None:
                      message = ET.SubElement(context, "message")
                      ET.SubElement(message, "source").text = source
                  translation = message.find("translation")
                  if translation is None:
                      translation = ET.SubElement(message, "translation")
                  elif translation.get("type") is None and (translation.text or "").strip():
                      continue
                  translation.attrib.pop("type", None)
                  translation.text = text
          
          ET.indent(tree)
          path.write_text('<?xml version="1.0" encoding="utf-8"?>\n<!DOCTYPE TS>\n'
                          + ET.tostring(root, encoding="unicode") + "\n", encoding="utf-8")
          # Keep the upstream updater, build-N tags and asset names unchanged.
          import os
          scm = Path("CMakeModules/GenerateSCMRev.cmake")
          text = scm.read_text(encoding="utf-8")
          upstream = "zortos293/Lichii"
          if text.count(upstream) != 3:
              raise RuntimeError("Upstream update configuration changed; review repository URLs")
          scm.write_text(text.replace(upstream, os.environ["FORK_REPO"]), encoding="utf-8")
          
          PY

      - name: 按上游 Windows 方式配置
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cmake -S . -B build/release -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=$DEPENDENCY_API_INIT" \
              -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF \
              -DYUZU_CMD=ON -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF \
              -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON \
              -DENABLE_QT_TRANSLATION=ON -DENABLE_UPDATE_CHECKER=ON \
              "-DLICHII_BUILD_TAG=$RELEASE_TAG" \
              -DLICHII_BUILD_PLATFORM=windows-x86_64 \
              -DUSE_DISCORD_PRESENCE=OFF \
              "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
              "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
              "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
              "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
              "-DCMAKE_C_FLAGS=-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin" \
              "-DCMAKE_CXX_FLAGS=-EHsc -DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: 编译
        run: cmake --build build/release --target yuzu yuzu-cmd lichii-updater --parallel

      - name: 验证并打包
        shell: pwsh
        run: |
          foreach ($exe in 'lichii.exe', 'eden-cli.exe', 'lichii-updater.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) { throw "$exe is missing" }
          }
          if (-not (Test-Path 'build/release/src/yuzu/zh_CN.qm')) { throw 'zh_CN.qm is missing' }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          Compress-Archive -Path build/release/bin/* -DestinationPath lichii-windows-x86_64.zip
          $hash = (Get-FileHash lichii-windows-x86_64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lichii-windows-x86_64.zip" | Set-Content SHA256SUMS.txt -Encoding utf8

      - name: 发布中文版 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @"
          Windows x64 简体中文版。解压后运行 lichii.exe。
          上游 Release：https://github.com/zortos293/Lichii/releases/tag/$env:RELEASE_TAG
          上游源码：https://github.com/zortos293/Lichii/tree/$env:UPSTREAM_SHA
          程序更新检查指向 https://github.com/$env:FORK_REPO 。
          "@ | Set-Content release-notes.txt -Encoding utf8
          gh release view $env:RELEASE_TAG --repo $env:FORK_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:FORK_REPO --target '${{ github.sha }}' --draft --title $env:RELEASE_TITLE --notes-file release-notes.txt
            if ($LASTEXITCODE -ne 0) { throw 'Create release failed' }
          }
          gh release upload $env:RELEASE_TAG lichii-windows-x86_64.zip SHA256SUMS.txt --repo $env:FORK_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload assets failed' }
          gh release edit $env:RELEASE_TAG --repo $env:FORK_REPO --title $env:RELEASE_TITLE --notes-file release-notes.txt --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publish release failed' }

